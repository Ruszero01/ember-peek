[package]
name = "ember-peek"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
rfd = "0.15"
semver = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ember-runtime = { path = "../crates/runtime" }
base64 = "0.22"
percent-encoding = "2"
tempfile = "3"
# Encoding the workshop's preview screenshots; the model reads PNG, not raw pixels.
png = "0.17"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
ember-file-store = { path = "../crates/file-store" }
sha2 = "0.10"
oxc_allocator = "=0.115.0"
oxc_parser = "=0.115.0"
oxc_span = "=0.115.0"
oxc_ast = "=0.115.0"
oxc_ast_visit = "=0.115.0"
flate2 = "1.1.10"
tar = "0.4.46"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_Storage_Xps"] }
