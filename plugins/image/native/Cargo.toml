[package]
name = "ember-image-plugin"
# A plugin's version is its own: it ships independently of the host's version, and the
# packaging step refuses a crate that disagrees with the package's plugin.json.
version = "0.1.0"
edition.workspace = true

[dependencies]
ember-plugin-sdk = { path = "../../../sdk/native" }
serde_json.workspace = true
