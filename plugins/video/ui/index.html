<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./sdk-ui.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="viewer" hidden>
      <video playsinline preload="auto"></video>
      <p id="message"></p>
    </main>
    <section id="transport" hidden aria-label="Video controls">
      <div class="ui-media-transport">
        <button id="play" class="ui-icon-button" type="button"></button>
        <span id="current" class="ui-media-time">0:00</span>
        <input id="timeline" class="ui-timeline" type="range" min="0" max="1" step="any" value="0" />
        <span id="duration" class="ui-media-time">0:00</span>
      </div>
    </section>
    <script type="module" src="./view.js"></script>
  </body>
</html>
