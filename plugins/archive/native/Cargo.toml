[package]
name = "ember-archive-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ember-plugin-sdk = { path = "../../../sdk/native" }
serde_json.workspace = true
base64 = "0.22"
# Read-only decoders for the containers and codecs a preview has to open. Every one of them
# is either pure Rust or ships its own sources, so an installed package needs nothing else.
zip = { version = "9", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate-flate2-zlib-rs",
    "deflate64",
    "lzma",
    "ppmd",
    "time",
    "xz",
    "zstd",
] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }
zstd = "0.13"
lz4_flex = "0.14"
sevenz-rust2 = { version = "0.24", default-features = false, features = [
    "bzip2",
    "deflate",
    "lz4",
    "ppmd",
    "util",
    "zstd",
] }
unrar = "0.5"
cab = "0.6"

[dev-dependencies]
tempfile = "3"
# The 7z fixture is written by the crate itself, so the compress side is only needed to
# build tests. An installed package carries the decoders alone.
sevenz-rust2 = { version = "0.24", features = ["compress"] }
