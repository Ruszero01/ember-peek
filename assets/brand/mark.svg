<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#b7572f">
  <!--
    图形画在 64 格上，但不在格子中央：尾焰往左伸得比身体往右远，整幅图偏左 5.331 单位
    （图形中心 26.669 / 31.592，格心 32 / 32）。这层 translate 把它挪回格心，因此外部按
    正方形居中就能得到视觉居中。
  -->
  <g transform="translate(5.331 0.408)">
    <path fill="#b7572f" fill-rule="evenodd" d="M28.182 3.864 C30.000 10.909 26.591 14.886 21.705 19.318 C16.477 23.864 13.750 27.500 14.205 33.182 C11.705 30.114 11.364 26.136 12.273 22.500 C6.705 25.568 4.318 31.818 4.432 37.614 C4.545 48.636 12.955 57.727 25.114 58.409 C29.318 58.750 33.182 57.727 35.682 56.591 C37.841 55.568 38.864 56.591 40.682 58.068 C42.500 59.659 44.886 59.773 46.364 58.182 C48.295 56.136 47.386 54.205 46.136 52.841 C44.318 51.023 44.318 49.886 45.341 48.068 C49.205 42.500 50.000 36.250 47.386 30.682 C45.341 26.591 43.409 23.864 43.864 19.091 C40.568 20.909 38.977 24.318 39.205 28.295 C36.705 25.341 37.841 22.273 38.068 18.977 C38.750 12.045 34.545 6.250 28.182 3.864 ZM38.125 40.909A11.193 11.193 0 1 1 15.739 40.909A11.193 11.193 0 1 1 38.125 40.909Z"/>
    <!--
      瞳孔和高光合成一条路径：evenodd 让高光成为真正的镂空，取背后的颜色——浅色界面上就是
      浅色，深色界面上就是深色。半径 2 略大于瞳孔半径与圆心距之差（4.659 - 2.897 = 1.762），
      因此缺口切穿瞳孔边缘，不在高光外面留一圈砖红，像苹果标志那个缺口。
    -->
    <path fill="#b7572f" fill-rule="evenodd" d="M25.114 37.614A4.659 4.659 0 1 0 34.432 37.614A4.659 4.659 0 1 0 25.114 37.614Z M29.932 35.682A2 2 0 1 0 33.932 35.682A2 2 0 1 0 29.932 35.682Z"/>
  </g>
</svg>
