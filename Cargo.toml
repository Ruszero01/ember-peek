[workspace]
members = ["src-tauri", "crates/runtime", "crates/file-store", "crates/text-document", "crates/office-document", "sdk/native", "plugins/text/native", "plugins/code/native", "plugins/markdown/native", "plugins/image/native", "plugins/psd/native", "plugins/word/native", "plugins/powerpoint/native", "plugins/excel/native", "plugins/video/native", "plugins/pdf/native", "plugins/pdf-editor/native", "plugins/text-editor/native", "plugins/metadata/native", "plugins/workshop/native"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }

[profile.release]
lto = "thin"
strip = true
