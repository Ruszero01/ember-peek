[workspace]
members = ["src-tauri", "crates/runtime", "crates/file-store", "crates/text-document", "crates/office-document", "sdk/native", "plugins/text/native", "plugins/code/native", "plugins/markdown/native", "plugins/image/native", "plugins/psd/native", "plugins/model/native", "plugins/word/native", "plugins/powerpoint/native", "plugins/excel/native", "plugins/video/native", "plugins/audio/native", "plugins/archive/native", "plugins/pdf/native", "plugins/pdf-editor/native", "plugins/text-editor/native", "plugins/metadata/native", "plugins/workshop/native", "plugins/font/native"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }

[profile.release]
lto = "thin"
strip = true

# Keep native model decoding responsive in the shared development app.
[profile.dev.package.ember-model-plugin]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.zlib-rs]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

# Keep chunked audio decoding responsive in development builds.
[profile.dev.package.ember-audio-plugin]
opt-level = 2

[profile.dev.package.symphonia-codec-alac]
opt-level = 2

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2

[profile.dev.package.symphonia-core]
opt-level = 2

[profile.dev.package.symphonia-codec-pcm]
opt-level = 2

[profile.dev.package.symphonia-format-riff]
opt-level = 2
